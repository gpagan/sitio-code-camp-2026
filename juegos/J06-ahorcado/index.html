<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina la palabra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Adivina la palabra</h1>
    <p class="instrucciones">Adivina la palabra letra por letra con tu teclado o con los botones. Tienes 6 errores antes de perder.</p>
  </header>

  <main class="juego">
    <!-- El dibujo: cada error muestra una parte más -->
    <svg id="dibujo" class="dibujo" viewBox="0 0 200 220" role="img" aria-label="Dibujo del ahorcado">
      <line x1="20" y1="210" x2="180" y2="210" class="base"/>
      <line x1="50" y1="210" x2="50" y2="20" class="base"/>
      <line x1="50" y1="20" x2="130" y2="20" class="base"/>
      <line x1="130" y1="20" x2="130" y2="45" class="base"/>
      <circle cx="130" cy="65" r="20" class="parte"/>
      <line x1="130" y1="85" x2="130" y2="140" class="parte"/>
      <line x1="130" y1="100" x2="105" y2="120" class="parte"/>
      <line x1="130" y1="100" x2="155" y2="120" class="parte"/>
      <line x1="130" y1="140" x2="110" y2="175" class="parte"/>
      <line x1="130" y1="140" x2="150" y2="175" class="parte"/>
    </svg>

    <div class="lado">
      <p id="pista" class="pista"></p>
      <p id="palabra" class="palabra"></p>
      <p>Errores: <b id="errores">0</b> de 6</p>
      <p id="mensaje" class="mensaje"></p>
      <button id="boton-nueva" hidden>Otra palabra</button>
    </div>
  </main>

  <div id="teclado" class="teclado"></div>

  <script src="script.js"></script>
</body>
</html>
